<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos — Biblioteca</title>
    <link rel="stylesheet" href="/static/css/sistema.css">
    <link rel="shortcut icon" href="/static/img/books.png" type="image/x-icon">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="sidebar-logo"><svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg></span>
                <span class="sidebar-brand-text">
                    <span class="sidebar-brand-name">Biblioteca</span>
                    <span class="sidebar-brand-sub"></span>
                </span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegação principal"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <span class="sidebar-user-avatar" id="sidebarUserAvatar" aria-hidden="true">?</span>
                    <div class="sidebar-user-text" id="sidebarUserInfo"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="sidebar-toggle" id="sidebarToggle" title="Abrir menu" aria-label="Abrir menu" aria-expanded="false">
                        <svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg>
                    </button>
                    <nav class="breadcrumb" aria-label="Trilha de navegação">
                        <a href="/sistema">Início</a>
                        <span class="crumb-sep" aria-hidden="true">/</span>
                        <span>Empréstimos</span>
                    </nav>
                </div>
                <div class="topbar-right">
                    <button class="btn-icon" id="darkModeToggle" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">
                        <svg class="ic" aria-hidden="true"><use href="#i-lamp-off"></use></svg>
                    </button>
                </div>
            </header>

            <div class="content">
                <div class="page-container">
                    <header class="page-head">
                        <div class="page-head-text">
                            <p class="page-kicker">Circulação</p>
                            <h1>Empréstimos</h1>
                            <p>Registrar, renovar e gerenciar empréstimos com regras automáticas</p>
                        </div>
                        <div class="page-head-actions">
                            <div class="search-box search-large">
                                <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
                                <input type="text" id="searchHistorico" placeholder="Pesquisar por usuário ou livro...">
                            </div>
                        </div>
                    </header>

                    <div class="card">
                        <span class="index-tab">Novo empréstimo</span>
                        <div class="card-body">
                            <form id="emprestimoForm">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="usuario_id">Usuário</label>
                                        <select id="usuario_id" required>
                                            <option value="">Selecione um usuário...</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="livro_id">Livro</label>
                                        <select id="livro_id" required>
                                            <option value="">Selecione um livro...</option>
                                        </select>
                                    </div>
                                </div>
                                <div id="regrasUsuarioBox" class="regras-box" style="display:none;margin-bottom:16px"></div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="data_emprestimo">Data do Empréstimo</label>
                                        <input type="date" id="data_emprestimo" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="data_prevista_devolucao">Data Prevista p/ Devolução</label>
                                        <input type="date" id="data_prevista_devolucao" required>
                                        <div style="font-size:11px;color:var(--ink-faint);margin-top:4px">Calculada automaticamente conforme a categoria.</div>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn btn-primary">
                                        <svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg> Registrar Empréstimo
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <span class="index-tab">Histórico</span>
                        <div class="card-header">
                            <h3><svg class="ic" aria-hidden="true"><use href="#i-history"></use></svg> Empréstimos</h3>
                            <div class="acoes-grupo">
                                <button class="btn btn-sm btn-secondary" id="btnSomenteAtivos">Somente ativos</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table" id="tabelaEmprestimos">
                                    <thead>
                                        <tr>
                                            <th>Usuário</th>
                                            <th>Livro</th>
                                            <th>Empréstimo</th>
                                            <th>Previsão</th>
                                            <th>Devolução</th>
                                            <th>Renovações</th>
                                            <th>Status</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody id="emprestimosBody"></tbody>
                                </table>
                            </div>
                            <div class="pagination" id="emprestimosPaginacao"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/emprestimos.js"></script>
</body>
</html>
