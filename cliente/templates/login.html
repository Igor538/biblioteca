<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Biblioteca</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <div class="login-area">

        <div class="login-col">

            <a class="voltar-site" href="{{ url_for('index') }}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                Voltar ao site
            </a>

            <div class="container">

                <h2>Login da Biblioteca</h2>

                <form id="loginForm">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="E-mail"
                        required
                    >

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Senha"
                        required
                    >

                    <button type="button" id="btnEsqueceuSenha" class="link-btn">Esqueceu sua senha?</button>

                    <div id="mensagem"></div>

                    <button type="submit">
                        Entrar
                    </button>

                </form>

                <p>
                    Não possui conta?
                    <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
                </p>

                <p>
                    Quer apenas consultar?
                    <a href="/catalogo">Ver livros sem cadastro</a>
                </p>

            </div>

        </div>

        <div class="gif-container">

            <img
                src="{{ url_for('static', filename='img/biblioteca.gif') }}"
                alt="Livro animado"
            >

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
