<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas — Biblioteca</title>
    <link rel="stylesheet" href="/static/css/sistema.css">
    <link rel="shortcut icon" href="/static/img/books.png" type="image/x-icon">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="sidebar-logo"><svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg></span>
                <span class="sidebar-brand-text">
                    <span class="sidebar-brand-name">Biblioteca</span>
                    <span class="sidebar-brand-sub"></span>
                </span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegação principal"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <span class="sidebar-user-avatar" id="sidebarUserAvatar" aria-hidden="true">?</span>
                    <div class="sidebar-user-text" id="sidebarUserInfo"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="sidebar-toggle" id="sidebarToggle" title="Abrir menu" aria-label="Abrir menu" aria-expanded="false">
                        <svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg>
                    </button>
                    <nav class="breadcrumb" aria-label="Trilha de navegação">
                        <a href="/sistema">Início</a>
                        <span class="crumb-sep" aria-hidden="true">/</span>
                        <span>Reservas</span>
                    </nav>
                </div>
                <div class="topbar-right">
                    <button class="btn-icon" id="darkModeToggle" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">
                        <svg class="ic" aria-hidden="true"><use href="#i-lamp-off"></use></svg>
                    </button>
                </div>
            </header>

            <div class="content">
                <div class="page-container">
                    <header class="page-head">
                        <div class="page-head-text">
                            <p class="page-kicker">Circulação</p>
                            <h1>Reservas</h1>
                            <p>Reserve obras indisponíveis e acompanhe a fila de espera</p>
                        </div>
                        <div class="page-head-actions" id="reservaHeadActions" style="display:none">
                            <button class="btn btn-primary" id="btnNovaReserva">
                                <svg class="ic" aria-hidden="true"><use href="#i-reserve"></use></svg> Nova Reserva
                            </button>
                        </div>
                    </header>

                    <div id="reservaFormCard" class="card" style="display:none">
                        <span class="index-tab">Nova reserva</span>
                        <div class="card-body">
                            <form id="reservaForm">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="livroReserva">Livro</label>
                                        <select id="livroReserva" required>
                                            <option value="">Selecione um livro...</option>
                                        </select>
                                    </div>
                                </div>
                                <div id="reservaInfoBox" class="suspensao-box" style="display:none"></div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn-secondary" id="btnCancelarReservaForm">
                                        Cancelar
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <svg class="ic" aria-hidden="true"><use href="#i-reserve"></use></svg> Confirmar Reserva
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <span class="index-tab">Fila de espera</span>
                        <div class="card-header">
                            <h3><svg class="ic" aria-hidden="true"><use href="#i-reserve"></use></svg> Reservas</h3>
                            <div class="acoes-grupo">
                                <div class="search-box" style="max-width:280px">
                                    <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
                                    <input type="text" id="searchReserva" placeholder="Filtrar reservas...">
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table" id="tabelaReservas">
                                    <thead>
                                        <tr>
                                            <th>Livro</th>
                                            <th>Usuário</th>
                                            <th>Data</th>
                                            <th>Posição</th>
                                            <th>Status</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody id="reservasBody"></tbody>
                                </table>
                            </div>
                            <div class="pagination" id="reservasPaginacao"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/reservas.js"></script>
</body>
</html>
