<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Biblioteca</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>

<body>

    <div class="cadastro-container">

        <div class="cadastro-header">
            <h1>Biblioteca</h1>
            <h2>Criar uma conta</h2>
            <p>Cadastre seus dados para acessar o sistema</p>
        </div>

        <form method="POST" id="cadastroForm">

            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="Digite seu CPF"
                    required
                >
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de nascimento</label>
                <input
                    type="date"
                    id="data_nascimento"
                    name="data_nascimento"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="Digite seu telefone"
                    required
                >
            </div>

            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input
                    type="text"
                    id="matricula"
                    name="matricula"
                    placeholder="Digite sua matrícula"
                    required
                >
            </div>

            <div class="form-group">
                <label for="curso">Curso</label>
                <input
                    type="text"
                    id="curso"
                    name="curso"
                    placeholder="Digite seu curso"
                    required
                >
            </div>

            <div class="form-group">
                <label for="setor">Setor</label>
                <input
                    type="text"
                    id="setor"
                    name="setor"
                    placeholder="Digite seu setor"
                    required
                >
            </div>

            <div class="form-group">
                <label for="tipo_usuario">Quem você é?</label>

                <select
                    id="tipo_usuario"
                    name="tipo_usuario"
                    required
                >
                    <option value="">Selecione uma opção</option>
                    <option value="Aluno">Aluno</option>
                    <option value="Professor">Professor</option>
                    <option value="Servidor">Servidor</option>
                    <option value="Bibliotecário">Bibliotecário</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    placeholder="Digite a senha novamente"
                    required
                >
            </div>

            <div id="mensagem"></div>

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <div class="login-link">
            <p>
                Já possui uma conta?
                <a href="{{ url_for('login') }}">Fazer login</a>
            </p>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>

</body>
</html>
