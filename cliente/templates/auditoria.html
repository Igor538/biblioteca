<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria e Logs — Biblioteca</title>
    <link rel="stylesheet" href="/static/css/sistema.css">
    <link rel="shortcut icon" href="/static/img/books.png" type="image/x-icon">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="sidebar-logo"><svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg></span>
                <span class="sidebar-brand-text">
                    <span class="sidebar-brand-name">Biblioteca</span>
                    <span class="sidebar-brand-sub"></span>
                </span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegação principal"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <span class="sidebar-user-avatar" id="sidebarUserAvatar" aria-hidden="true">?</span>
                    <div class="sidebar-user-text" id="sidebarUserInfo"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="sidebar-toggle" id="sidebarToggle" title="Abrir menu" aria-label="Abrir menu" aria-expanded="false">
                        <svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg>
                    </button>
                    <nav class="breadcrumb" aria-label="Trilha de navegação">
                        <a href="/sistema">Início</a>
                        <span class="crumb-sep" aria-hidden="true">/</span>
                        <span>Auditoria e Logs</span>
                    </nav>
                </div>
                <div class="topbar-right">
                    <button class="btn-icon" id="darkModeToggle" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">
                        <svg class="ic" aria-hidden="true"><use href="#i-lamp-off"></use></svg>
                    </button>
                </div>
            </header>

            <div class="content">
                <div class="page-container">
                    <header class="page-head">
                        <div class="page-head-text">
                            <p class="page-kicker">Gestão</p>
                            <h1>Auditoria e Logs</h1>
                            <p>Registro de todas as operações realizadas no sistema</p>
                        </div>
                        <div class="page-head-actions">
                            <button class="btn btn-primary" id="btnExportarBackup">
                                <svg class="ic" aria-hidden="true"><use href="#i-download"></use></svg> Exportar Backup
                            </button>
                        </div>
                    </header>

                    <div class="stats-grid" id="auditoriaStats" style="margin-bottom:22px"></div>

                    <div class="card">
                        <span class="index-tab">Registros</span>
                        <div class="card-header">
                            <h3><svg class="ic" aria-hidden="true"><use href="#i-audit"></use></svg> Logs de operações</h3>
                            <div class="acoes-grupo">
                                <div class="search-box" style="max-width:260px">
                                    <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
                                    <input type="text" id="searchAuditoria" placeholder="Filtrar por operação...">
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table" id="tabelaAuditoria">
                                    <thead>
                                        <tr>
                                            <th>Data/Hora</th>
                                            <th>Responsável</th>
                                            <th>Operação</th>
                                            <th>Detalhes</th>
                                        </tr>
                                    </thead>
                                    <tbody id="auditoriaBody"></tbody>
                                </table>
                            </div>
                            <div class="pagination" id="auditoriaPaginacao"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/auditoria.js"></script>
</body>
</html>
