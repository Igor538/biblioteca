<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações — Biblioteca</title>
    <link rel="stylesheet" href="/static/css/sistema.css">
    <link rel="shortcut icon" href="/static/img/books.png" type="image/x-icon">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="sidebar-logo"><svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg></span>
                <span class="sidebar-brand-text">
                    <span class="sidebar-brand-name">Biblioteca</span>
                    <span class="sidebar-brand-sub"></span>
                </span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegação principal"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <span class="sidebar-user-avatar" id="sidebarUserAvatar" aria-hidden="true">?</span>
                    <div class="sidebar-user-text" id="sidebarUserInfo"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="sidebar-toggle" id="sidebarToggle" title="Abrir menu" aria-label="Abrir menu" aria-expanded="false">
                        <svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg>
                    </button>
                    <nav class="breadcrumb" aria-label="Trilha de navegação">
                        <a href="/sistema">Início</a>
                        <span class="crumb-sep" aria-hidden="true">/</span>
                        <span>Notificações</span>
                    </nav>
                </div>
                <div class="topbar-right">
                    <button class="btn-icon" id="darkModeToggle" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">
                        <svg class="ic" aria-hidden="true"><use href="#i-lamp-off"></use></svg>
                    </button>
                </div>
            </header>

            <div class="content">
                <div class="page-container">
                    <header class="page-head">
                        <div class="page-head-text">
                            <p class="page-kicker">Conta</p>
                            <h1>Notificações</h1>
                            <p>Avisos sobre prazos, renovações, reservas e suspensões</p>
                        </div>
                        <div class="page-head-actions">
                            <button class="btn btn-secondary" id="btnLerTodas">
                                <svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg> Marcar todas como lidas
                            </button>
                        </div>
                    </header>

                    <div class="card">
                        <div class="card-header">
                            <h3><svg class="ic" aria-hidden="true"><use href="#i-bell"></use></svg> Suas notificações</h3>
                            <span class="status-badge status-info" id="notifContagem"></span>
                        </div>
                        <div class="card-body" id="notificacoesList"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/notificacoes.js"></script>
</body>
</html>
